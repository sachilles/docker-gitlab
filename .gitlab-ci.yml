image: docker:27-git

services:
  - name: docker:27-dind

stages:
  - lint
  - build

variables:
  DOCKER_TLS_CERTDIR: ""
  DOCKER_HOST: "tcp://docker:2376"

  DOCKER_BUILDKIT: "1"
  BUILDKIT_PROGRESS: "plain"

shellcheck:
  stage: lint
  image: koalaman/shellcheck-alpine:stable
  script:
    - shellcheck --version
    - |
      find . -type f \( -name "*.sh" -o -name "*.bash" \) -print0 |
      xargs -0 -r shellcheck -e SC2086,SC2181

before_script:
  # - export VERSION="$(cat VERSION 2>/dev/null || echo latest)"
  - docker version
  - docker buildx version
  - docker buildx ls
  - export DOCKER_IMAGE="${DOCKER_IMAGE:-${CI_REGISTRY_IMAGE}}"
  - |
    echo "${CI_REGISTRY_PASSWORD:-$CI_JOB_TOKEN}" |
    docker login \
      --username "${CI_REGISTRY_USER:-gitlab-ci-token}" \
      --password-stdin \
      "${CI_REGISTRY}"
  - |
    if ! docker buildx inspect gitlab-builder >/dev/null 2>&1; then
      docker buildx create \
        --driver docker-container \
        --name gitlab-builder
    fi

  - docker buildx use gitlab-builder
  - docker buildx inspect --bootstrap

.build_template:
  stage: build
  interruptible: true
  retry:
    max: 2
    when:
      - runner_system_failure
      - api_failure
      - stuck_or_timeout_failure
  script:
    - |
      docker buildx build \
        --pull \
        --push \
        --provenance=false \
        --cache-from type=registry,ref="${DOCKER_IMAGE}:cache" \
        --cache-from type=registry,ref="${DOCKER_IMAGE}:${CACHE_TAG}" \
        --cache-to type=registry,ref="${DOCKER_IMAGE}:${CACHE_TAG}",mode=max \
        --build-arg BUILDKIT_INLINE_CACHE=1 \
        --build-arg VCS_REF="$(git rev-parse --short HEAD)" \
        --build-arg BUILD_DATE="$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
        --tag "${IMAGE_TAG}" \
        .

docker:build:
  extends: .build_template
  rules:  # only for master branch
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  variables:
    IMAGE_TAG: "${CI_REGISTRY_IMAGE}:latest"
    CACHE_TAG: "cache"

docker:build:branches:
  extends: .build_template
  rules:  # for all branches except master
    - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'
  variables:
    IMAGE_TAG: "${CI_REGISTRY_IMAGE}:${CI_COMMIT_REF_SLUG}"
    CACHE_TAG: "cache-${CI_COMMIT_REF_SLUG}"

docker:build:release:
  extends: .build_template
  rules:  # only release builds
    - if: '$CI_COMMIT_TAG'
  variables:
    IMAGE_TAG: "${CI_REGISTRY_IMAGE}:${CI_COMMIT_TAG}"
    CACHE_TAG: "cache-release"