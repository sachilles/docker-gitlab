image: docker:27-git

services:
  - docker:27-dind

stages:
  - build

variables:
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_DRIVER: overlay2
  DOCKER_BUILDKIT: "1"

before_script:
  - export VERSION=$(cat VERSION 2>/dev/null || echo "latest")
  - export CI_REGISTRY=${CI_REGISTRY:-hub.docker.com}
  - export CI_REGISTRY_USER=${CI_REGISTRY_USER:-gitlab-ci-token}
  - export CI_REGISTRY_PASSWORD=${CI_REGISTRY_PASSWORD:-${CI_JOB_TOKEN}}
  - export DOCKER_IMAGE=${DOCKER_IMAGE:-${CI_REGISTRY}/${CI_PROJECT_PATH}}
  - echo "${CI_REGISTRY_PASSWORD}" | \
      docker login --username "${CI_REGISTRY_USER}" \
      --password-stdin \
      "${CI_REGISTRY}"

.build_template:
  stage: build
  script:
    - docker build \
        --pull \
        --cache-from "${DOCKER_IMAGE}:${CACHE_TAG}" \
        --build-arg VCS_REF="$(git rev-parse --short HEAD)" \
        --build-arg BUILD_DATE="$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
        --tag "${IMAGE_TAG}" .
    - docker push "${IMAGE_TAG}"

docker:build:
  extends: .build_template
  rules:  # only build on master branch
    - if: '${CI_COMMIT_BRANCH} == ${CI_DEFAULT_BRANCH}'
  variables:
    IMAGE_TAG: "${CI_REGISTRY_IMAGE}:latest"
    CACHE_TAG: "latest"

docker:build:branches:
  extends: .build_template
  rules:  # only builds of all branches except master
    - if: '${CI_COMMIT_BRANCH} && ${CI_COMMIT_BRANCH} != ${CI_DEFAULT_BRANCH}'
  variables:
    IMAGE_TAG: "${CI_REGISTRY_IMAGE}:${CI_COMMIT_REF_SLUG}"
    CACHE_TAG: "${CI_COMMIT_REF_SLUG}"

docker:build:release:
  extends: .build_template
  stage: build
  rules:  # builds related to tags
    - if: '${CI_COMMIT_TAG}'
  variables:
    IMAGE_TAG: "${CI_REGISTRY_IMAGE}:${CI_COMMIT_TAG}"
    CACHE_TAG: "${CI_COMMIT_TAG}"